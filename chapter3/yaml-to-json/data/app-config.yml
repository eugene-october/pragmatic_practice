application:
  name: PixelForge
  version: 2.4.1
  environment: production
  debug: false
  locale: en_US
  timezone: UTC
  base_url: https://pixelforge.example.com
  admin_email: admin@pixelforge.example.com

storage:
  provider: s3
  bucket: pixelforge-assets
  region: us-east-1
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  encryption: AES256
  lifecycle:
    transition_to_glacier_days: 90
    expiration_days: 365

queue:
  driver: rabbitmq
  host: mq.internal
  port: 5672
  vhost: /pixelforge
  username: queue_user
  password: "${MQ_PASSWORD}"
  exchange: pixelforge.events
  retry:
    max_attempts: 5
    backoff: exponential
    base_delay: 1000

monitoring:
  enabled: true
  provider: datadog
  api_key: "${DATADOG_API_KEY}"
  metrics_interval: 15
  apm:
    enabled: true
    sample_rate: 0.1
  alerts:
    cpu_threshold: 80
    memory_threshold: 85
    disk_threshold: 90

security:
  jwt_secret: "${JWT_SECRET}"
  token_expiry: 3600
  refresh_token_expiry: 604800
  bcrypt_rounds: 12
  cors:
    allowed_origins:
      - https://app.pixelforge.example.com
    allow_credentials: true
  rate_limit:
    enabled: true
    max_requests_per_minute: 60

email:
  provider: ses
  from_address: no-reply@pixelforge.example.com
  region: us-east-1
  templates:
    welcome: welcome-email-v2
    password_reset: reset-password-v1
    invoice: invoice-template-v3